# One-click deploy on Render: New + → Blueprint → connect this repository.
services:
  - type: web
    name: brokeros-terminal
    runtime: docker
    region: frankfurt
    plan: free
    healthCheckPath: /api/groups
    envVars:
      - key: ADMIN_KEY
        generateValue: true   # admin panel key: find it under Environment
      - key: NODE_ENV
        value: production
